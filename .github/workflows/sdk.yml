name: Swift SDK validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: swift test
      - run: xcodebuild -scheme Signaloryx -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
